spring:
  application:
    name: ZeroFraud360
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zerofraud360_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

fraud:
  # External decision-maker API as requested by user.
  # Configured to: http://localhost:xxxx/fraud/verify
  # Can be updated here or overridden via environment variable: FRAUD_DECISION_API_URL
  decision-api:
    base-url: ${FRAUD_DECISION_API_URL:http://localhost:xxxx}
    verify-path: /fraud/verify
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  rules:
    rapid-pass-through:
      enabled: true
      max-time-window-seconds: 180 # 3 minutes window
      currency: INR

bank:
  sim:
    base-url: ${BANK_SIMULATION_BASE_URL:${BANK_SIM_BASE_URL:http://localhost:8080}}
    service-token: ${BANK_SIMULATION_SERVICE_TOKEN:${BANK_SIM_SERVICE_TOKEN:sim-secret-token-360}}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

security:
  jwt:
    secret: ${ZEROFRAUD_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration-seconds: ${ZEROFRAUD_JWT_EXPIRATION_SECONDS:3600}
    issuer: zerofraud360
  login:
    max-failed-attempts: 5
    lock-duration-seconds: 300

logging:
  level:
    com.SIH.ZeroFraud360: INFO
    org.springframework.security: INFO
