spring:
  application:
    name: ZeroFraud360-Test
  datasource:
    url: jdbc:h2:mem:zerofraud360_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

fraud:
  decision-api:
    base-url: http://localhost:xxxx
    verify-path: /fraud/verify
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  rules:
    rapid-pass-through:
      enabled: true
      max-time-window-seconds: 180
      currency: INR

bank:
  sim:
    base-url: http://localhost:8080
    service-token: sim-secret-token-360
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-seconds: 3600
    issuer: zerofraud360-test
  login:
    max-failed-attempts: 5
    lock-duration-seconds: 300
