spring:
  application:
    name: IndianBankSimulation-Test
  datasource:
    url: jdbc:h2:mem:banksim_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000 # 1 hour
    issuer: zerofraud360-test

bank:
  security:
    internal-service-token: sim-secret-token-360
  zerofraud360:
    events-url: http://localhost:8081/internal/v1/events/payment-success
  holds:
    scheduler:
      enabled: false
    expiration-check-interval-ms: 60000
  outbox:
    scheduler:
      enabled: false
    publisher-interval-ms: 60000
